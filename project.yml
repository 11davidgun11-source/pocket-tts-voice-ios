name: PocketVoice
options:
  bundleIdPrefix: com.davidgun
  deploymentTarget:
    iOS: "17.0"
packages:
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    branch: master
targets:
  PocketVoice:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme: {}
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidgun.pocketvoice
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      properties:
        CFBundleDisplayName: PocketVoice
        NSMicrophoneUsageDescription: PocketVoice needs the mic to record your 10 second voice sample. Only your voice. All work stays on this phone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
